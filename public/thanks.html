<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Демо-заявка сформирована — SOFTCARE</title>
  <meta name="theme-color" content="#465B4D">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    :root {
      --canvas: #F4F0E8;
      --surface: #FFFFFF;
      --line: #D9D3C4;
      --forest: #465B4D;
      --graphite: #292D29;
      --muted: #656B65;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--canvas);
      color: var(--graphite);
      font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: clamp(28px, 5vw, 48px);
      box-shadow: 0 18px 40px rgba(41, 45, 41, 0.1);
      text-align: center;
    }
    .mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(155, 170, 152, 0.28);
      color: var(--forest);
    }
    h1 { margin: 0 0 10px; font-size: clamp(1.5rem, 4vw, 2rem); letter-spacing: -0.02em; }
    p { margin: 0 0 8px; color: var(--muted); }
    .back {
      display: inline-block;
      margin-top: 22px;
      padding: 13px 22px;
      border-radius: 999px;
      background: var(--forest);
      color: #F4F0E8;
      font-weight: 700;
      text-decoration: none;
      transition: filter 0.2s ease;
    }
    .back:hover { filter: brightness(1.08); }
    .note { margin-top: 18px; font-size: 0.82rem; color: var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5"/>
      </svg>
    </div>
    <h1>Демо-заявка сформирована</h1>
    <p>Данные никуда не отправляются.</p>
    <p>Это демонстрационная страница подтверждения: расчёт из калькулятора показан, но заявка не сохранена и не передана оператору.</p>
    <a class="back" href="/">Вернуться на главную</a>
    <p class="note">SOFTCARE — демонстрационный проект. Страница подтверждения демо-оформления.</p>
  </main>
</body>
</html>
